<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Beacon Agent · Workspace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --green: #10b981;
      --green-bg: #ecfdf5;
      --amber: #f59e0b;
      --amber-bg: #fffbeb;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.6rem 1rem; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; z-index: 20; }
    .brand { font-size: 0.95rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
    .header-actions { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
    .project-pill { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-pill.registered { color: #047857; border-color: #a7f3d0; background: var(--green-bg); }
    .project-pill.unregistered { color: #b45309; border-color: #fde68a; background: var(--amber-bg); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 4px 10px; font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-ghost:hover { background: var(--bg); color: var(--text); border-color: #cbd5e1; }

    .app-body { display: flex; flex: 1; height: calc(100vh - 47px); overflow: hidden; }

    aside.session-sidebar { width: 244px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .btn-new-session { background: #f1f5f9; border: none; border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; font-weight: 600; color: var(--text); cursor: pointer; }
    .btn-new-session:hover { background: #e2e8f0; }
    .session-list { flex: 1; overflow-y: auto; padding: 0.6rem 0.45rem; display: flex; flex-direction: column; gap: 3px; }
    .session-item { padding: 7px 9px; border-radius: 8px; font-size: 0.82rem; color: #334155; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .session-item:hover { background: #f8fafc; }
    .session-item.active { background: #eef2ff; color: var(--primary); font-weight: 600; }
    .session-item-time { font-size: 0.68rem; color: var(--muted); font-weight: normal; }

    .feature-block { border-top: 1px solid var(--border-subtle); max-height: 40%; display: flex; flex-direction: column; }
    .feature-list { overflow-y: auto; padding: 0.5rem 0.45rem; display: flex; flex-direction: column; gap: 2px; }
    .feature-item { padding: 6px 9px; border-radius: 7px; font-size: 0.78rem; color: #334155; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
    .feature-item:hover { background: #f8fafc; }
    .feature-item.active { background: #f1f5f9; color: var(--text); font-weight: 600; }
    .feature-state { font-size: 0.66rem; color: var(--muted); flex-shrink: 0; }
    .empty-hint { padding: 10px 12px; font-size: 0.74rem; color: var(--muted); line-height: 1.5; }

    main.workspace-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .stream-viewport { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 0; }
    .workspace-layout { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    .hero { text-align: center; margin: 0.5rem 0 0.25rem; }
    .hero h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
    .hero p { font-size: 0.85rem; color: var(--muted); }
    .cards-flow { display: flex; flex-direction: column; gap: 1rem; width: 100%; padding-bottom: 1rem; }

    .gen-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
    .gen-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 9px; }
    .card-tag { font-size: 0.7rem; font-weight: 700; color: var(--primary); background: #eef2ff; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .card-tag.goal { color: #047857; background: var(--green-bg); }
    .card-tag.error { color: #b91c1c; background: var(--red-bg); }
    .card-title { font-size: 1rem; font-weight: 700; }
    .card-body { font-size: 0.88rem; line-height: 1.65; color: #334155; white-space: pre-wrap; }
    .invariants-box { background: var(--amber-bg); border: 1px solid #fef3c7; border-radius: 8px; padding: 9px 12px; font-size: 0.8rem; color: #92400e; }
    .invariants-box ul { margin-left: 16px; line-height: 1.55; }

    .stage-row { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; border: 1px solid var(--border); }
    .stage-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .state { font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
    .state.done { color: #047857; background: var(--green-bg); }
    .state.active { color: #b45309; background: var(--amber-bg); }
    .state.pending { color: var(--muted); background: #f1f5f9; }
    .state.blocked { color: #b91c1c; background: var(--red-bg); }

    .row-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
    .btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 7px 15px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 15px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .meta-line { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .verdict { border-radius: 8px; padding: 9px 12px; font-size: 0.8rem; line-height: 1.55; }
    .verdict.pass { background: var(--green-bg); border: 1px solid #a7f3d0; color: #065f46; }
    .verdict.block { background: var(--red-bg); border: 1px solid #fecaca; color: #991b1b; }
    .verdict ul { margin-left: 16px; }

    .bottom-input-container { width: 100%; background: linear-gradient(180deg, rgba(248,250,252,0) 0%, rgba(248,250,252,0.95) 25%, #f8fafc 100%); padding: 0.6rem 1.5rem 1rem; display: flex; justify-content: center; }
    .input-wrapper { width: 100%; max-width: 780px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.7rem 0.9rem; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 7px; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    textarea { width: 100%; border: none; outline: none; resize: none; font-size: 0.9rem; font-family: inherit; color: var(--text); height: 42px; line-height: 1.45; background: transparent; }
    textarea::placeholder { color: #94a3b8; }
    .input-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 6px; gap: 10px; }
    .hint { font-size: 0.72rem; color: var(--muted); }

    aside.inspector-pane { width: 320px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .inspector-head { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border-subtle); }
    .inspector-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .inspector-slug { font-size: 0.8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 3px; color: var(--text); word-break: break-all; }
    .tab-bar { display: flex; gap: 2px; padding: 0.5rem 0.6rem 0; border-bottom: 1px solid var(--border-subtle); }
    .tab { font-size: 0.74rem; padding: 5px 9px; border-radius: 6px 6px 0 0; color: var(--muted); cursor: pointer; border: 1px solid transparent; border-bottom: none; }
    .tab.active { color: var(--text); background: var(--bg); border-color: var(--border); font-weight: 600; }
    .doc-view { flex: 1; overflow: auto; padding: 0.75rem 0.9rem; font-size: 0.76rem; line-height: 1.6; color: #334155; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .gate-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border-subtle); font-size: 0.75rem; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: var(--card); width: 100%; max-width: 520px; border-radius: 14px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden; }
    .modal-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1rem; font-weight: 700; }
    .modal-body { padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 1rem; max-height: 70vh; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 0.78rem; font-weight: 600; color: #334155; }
    .form-select, .form-input { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 7px 11px; font-size: 0.84rem; color: var(--text); outline: none; }
    .form-select:focus, .form-input:focus { border-color: var(--primary); }
    .modal-footer { padding: 0.9rem 1.2rem; border-top: 1px solid var(--border); background: var(--bg); display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span id="txtAppTitle">Beacon Agent · Workspace</span>
    </div>
    <div class="header-actions">
      <span class="project-pill" id="projectPill">loading workspace…</span>
      <button class="btn-ghost" onclick="toggleLang()" id="btnLang">English</button>
      <button class="btn-ghost" onclick="openSettings()" id="btnSettings">设置</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="session-sidebar" id="nav-pane">
      <div class="sidebar-header">
        <span class="sidebar-title" id="txtSessionTitle">会话</span>
        <button class="btn-new-session" onclick="startNewSession()" id="btnNewSession">+ 新建</button>
      </div>
      <div class="session-list" id="sessionList"></div>

      <div class="feature-block">
        <div class="sidebar-header">
          <span class="sidebar-title" id="txtFeatureTitle">需求包</span>
          <span class="feature-state" id="featureCount"></span>
        </div>
        <div class="feature-list" id="featureList">
          <div class="empty-hint" id="featureEmpty">尚未注册需求包</div>
        </div>
      </div>
    </aside>

    <main class="workspace-main">
      <div class="stream-viewport" id="streamViewport">
        <div class="workspace-layout">
          <div class="hero">
            <h1 id="txtHeroTitle">把一个想法，稳稳交付为真实代码</h1>
            <p id="txtHeroSubtitle">需求真相冻结 · 状态机推进 · 机器验资后人工放行</p>
          </div>
          <div class="cards-flow" id="cardsFlow"></div>
        </div>
      </div>

      <div class="bottom-input-container">
        <div class="input-wrapper">
          <div class="input-row">
            <textarea id="promptInput" placeholder="描述你想要实现的需求，例如：新增微信支付退款，支持原路返还并处理回调幂等…" onkeydown="handleKeyDown(event)"></textarea>
          </div>
          <div class="input-footer">
            <span class="hint" id="txtInputHint">⌘/Ctrl + Enter 发送 · 参谋长只做需求对齐，不动代码</span>
            <button class="btn-primary" onclick="runPlan()" id="btnRunPlan">方案分析</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="inspector-pane" id="inspector-pane">
      <div class="inspector-head">
        <div class="inspector-title" id="txtInspectorTitle">上下文</div>
        <div class="inspector-slug" id="inspectorSlug">未选择需求包</div>
      </div>
      <div class="tab-bar" id="inspectorTabs" style="display:none;">
        <div class="tab active" data-tab="truth" onclick="switchTab('truth')">truth.md</div>
        <div class="tab" data-tab="tests" onclick="switchTab('tests')">tests.md</div>
        <div class="tab" data-tab="gates" onclick="switchTab('gates')">门禁</div>
      </div>
      <div class="doc-view" id="inspectorBody">从左侧选择一个需求包，这里显示它的真实需求正文与门禁结论。</div>
    </aside>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="txtModalTitle">系统与模型设置</h3>
        <button class="btn-ghost" onclick="closeSettings()" style="padding: 2px 8px;">关闭</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">界面语言</label>
          <select class="form-select" id="selectLang" onchange="applyLang(this.value)">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">BYOK 网关地址 (OpenAI 兼容)</label>
          <input type="text" class="form-input" id="cfgBaseUrl" placeholder="http://127.0.0.1:10100/v1">
        </div>
        <div class="form-group">
          <label class="form-label">参谋长模型</label>
          <input type="text" class="form-input" id="modelChief" placeholder="deepseek-chat">
        </div>
        <div class="form-group">
          <label class="form-label">架构师模型</label>
          <input type="text" class="form-input" id="modelArchitect" placeholder="deepseek-reasoner">
        </div>
        <div class="form-group">
          <label class="form-label">编码 / 质检模型</label>
          <input type="text" class="form-input" id="modelCoder" placeholder="claude-3-5-sonnet">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closeSettings()" id="btnCancel">取消</button>
        <button class="btn-primary" onclick="saveSettings()" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      zh: {
        appTitle: "Beacon Agent · Workspace",
        sessions: "会话", newSession: "新建",
        features: "需求包",
        heroTitle: "把一个想法，稳稳交付为真实代码",
        heroSubtitle: "需求真相冻结 · 状态机推进 · 机器验资后人工放行",
        placeholder: "描述你想要实现的需求，例如：新增微信支付退款，支持原路返还并处理回调幂等…",
        hint: "⌘/Ctrl + Enter 发送 · 参谋长只做需求对齐，不动代码",
        runPlan: "方案分析",
        settings: "设置", save: "保存", cancel: "取消",
        inspector: "上下文", noSelection: "未选择需求包",
        inspectorEmpty: "从左侧选择一个需求包，这里显示它的真实需求正文与门禁结论。",
        noFeatures: "尚未注册需求包",
        planTag: "方案分析", goalTag: "目标运行", errorTag: "失败",
        execute: "创建目标运行", approve: "评估发布门禁",
        advance: "推进一步", selectExecutor: "执行器", unavailable: "（不可用）",
        degraded: "模型未返回结构化字段，风险与边界留空（不编造）",
        reasoning: "参谋长正在对齐需求…"
      },
      en: {
        appTitle: "Beacon Agent · Workspace",
        sessions: "Sessions", newSession: "New",
        features: "Packages",
        heroTitle: "Deliver an idea as verified code",
        heroSubtitle: "Frozen truth · staged run · human release after machine evidence",
        placeholder: "Describe the requirement, e.g. add WeChat refunds with idempotent callbacks…",
        hint: "Cmd/Ctrl + Enter to send · the Chief of Staff aligns intent only",
        runPlan: "Analyze",
        settings: "Settings", save: "Save", cancel: "Cancel",
        inspector: "Context", noSelection: "No package selected",
        inspectorEmpty: "Select a package on the left to read its real truth and gate verdicts.",
        noFeatures: "No packages registered yet",
        planTag: "Plan brief", goalTag: "Goal run", errorTag: "Failed",
        execute: "Create goal run", approve: "Evaluate release gate",
        advance: "Advance one step", selectExecutor: "Executor", unavailable: "(unavailable)",
        degraded: "The model returned no structured fields; risks and boundaries stay empty (nothing invented).",
        reasoning: "Chief of Staff is aligning intent…"
      }
    };
    let currentLang = "zh";
    let currentSessionId = "";
    let currentSlug = "";
    let currentRunId = "";
    let lastPrompt = "";
    let activeStream = null;
    let activeTab = "truth";
    let inspectorCache = null;

    function t() { return i18n[currentLang]; }

    async function invoke(method, ...args) {
      if (!(window.go && window.go.main && window.go.main.App)) {
        throw new Error("desktop bridge unavailable — launch this window with `beacon ui`");
      }
      return await window.go.main.App[method](...args);
    }

    function applyLang(lang) {
      currentLang = lang;
      const d = t();
      document.getElementById("txtAppTitle").textContent = d.appTitle;
      document.getElementById("txtSessionTitle").textContent = d.sessions;
      document.getElementById("btnNewSession").textContent = "+ " + d.newSession;
      document.getElementById("txtFeatureTitle").textContent = d.features;
      document.getElementById("txtHeroTitle").textContent = d.heroTitle;
      document.getElementById("txtHeroSubtitle").textContent = d.heroSubtitle;
      document.getElementById("promptInput").placeholder = d.placeholder;
      document.getElementById("txtInputHint").textContent = d.hint;
      document.getElementById("btnRunPlan").textContent = d.runPlan;
      document.getElementById("btnSettings").textContent = d.settings;
      document.getElementById("txtInspectorTitle").textContent = d.inspector;
      document.getElementById("txtModalTitle").textContent = d.settings;
      document.getElementById("btnCancel").textContent = d.cancel;
      document.getElementById("btnSave").textContent = d.save;
      document.getElementById("selectLang").value = lang;
      document.getElementById("btnLang").textContent = lang === "zh" ? "English" : "简体中文";
      if (!currentSlug) document.getElementById("inspectorSlug").textContent = d.noSelection;
      if (!currentSlug) document.getElementById("inspectorBody").textContent = d.inspectorEmpty;
      const empty = document.getElementById("featureEmpty");
      if (empty) empty.textContent = d.noFeatures;
    }

    function toggleLang() { applyLang(currentLang === "zh" ? "en" : "zh"); }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function scrollBottom() {
      const v = document.getElementById("streamViewport");
      v.scrollTo({ top: v.scrollHeight, behavior: "smooth" });
    }

    window.addEventListener("DOMContentLoaded", async () => {
      applyLang("zh");
      await loadProject();
      await refreshSessions();
      await refreshFeatures();
      setupStream();
    });

    async function loadProject() {
      try {
        const info = await invoke("GetProjectInfo");
        const pill = document.getElementById("projectPill");
        pill.textContent = info.root + (info.version ? " · " + info.version : "");
        pill.title = info.root;
        pill.className = "project-pill " + (info.registered ? "registered" : "unregistered");
        if (!info.registered) {
          pill.textContent += currentLang === "zh" ? " · 未注册" : " · unregistered";
        }
      } catch (e) {
        document.getElementById("projectPill").textContent = "workspace unavailable: " + e.message;
      }
    }

    async function refreshSessions() {
      let sessions = [];
      try { sessions = await invoke("GetSessions"); } catch (e) { console.warn(e); }
      sessions = sessions || [];
      const list = document.getElementById("sessionList");
      list.innerHTML = "";
      if (sessions.length === 0) {
        await startNewSession();
        return;
      }
      sessions.forEach((s, idx) => {
        const el = document.createElement("div");
        el.className = "session-item" + (s.id === currentSessionId ? " active" : "");
        el.innerHTML = '<span>' + esc(s.title) + '</span><span class="session-item-time">' +
          esc(new Date(s.updated_at).toLocaleString()) + '</span>';
        el.onclick = () => selectSession(s.id);
        list.appendChild(el);
        if (!currentSessionId && idx === 0) currentSessionId = s.id;
      });
      if (currentSessionId) await loadMessages(currentSessionId);
    }

    async function selectSession(id) {
      currentSessionId = id;
      currentRunId = "";
      document.getElementById("cardsFlow").innerHTML = "";
      await refreshSessions();
    }

    async function startNewSession() {
      try {
        const sess = await invoke("CreateSession", currentLang === "zh" ? "新需求任务" : "New task");
        currentSessionId = sess.id;
        currentRunId = "";
        document.getElementById("cardsFlow").innerHTML = "";
        await refreshSessions();
      } catch (e) {
        pushError(e.message);
      }
    }

    async function loadMessages(sessionId) {
      let msgs = [];
      try { msgs = await invoke("GetSessionMessages", sessionId); } catch (e) { return; }
      const flow = document.getElementById("cardsFlow");
      flow.innerHTML = "";
      currentRunId = "";
      (msgs || []).forEach(m => {
        if (m.role === "user") {
          pushUserBubble(m.content);
        } else if (m.card_type === "plan_brief") {
          renderPlanCard({
            restated_intent: m.content,
            identified_risks: [],
            boundaries: [],
            proposed_slugs: [parseSlug(m.card_payload)],
            degraded: parseDegraded(m.card_payload)
          }, true);
        } else if (m.card_type === "goal_run") {
          const payload = safeJSON(m.card_payload);
          if (payload) {
            currentRunId = payload.run_id;
            renderGoalCard(payload, true);
          }
        } else if (m.card_type === "release_verdict") {
          const payload = safeJSON(m.card_payload);
          if (payload) renderVerdict(payload);
        }
      });
      scrollBottom();
    }

    function safeJSON(s) { try { return JSON.parse(s || "{}"); } catch (e) { return null; } }
    function parseSlug(s) { const o = safeJSON(s); return (o && o.slug) || "feature"; }
    function parseDegraded(s) { const o = safeJSON(s); return !!(o && o.degraded); }

    function pushUserBubble(text) {
      const flow = document.getElementById("cardsFlow");
      const el = document.createElement("div");
      el.style.cssText = "align-self:flex-end;background:#e0e7ff;color:#1e1b4b;padding:9px 13px;border-radius:12px;font-size:0.9rem;max-width:80%;white-space:pre-wrap;";
      el.textContent = text;
      flow.appendChild(el);
      scrollBottom();
    }

    function pushError(msg) {
      const flow = document.getElementById("cardsFlow");
      const card = document.createElement("div");
      card.className = "gen-card";
      card.innerHTML = '<div class="gen-card-header"><span class="card-tag error">' + esc(t().errorTag) +
        '</span></div><div class="card-body" style="color:#b91c1c;">' + esc(msg) + '</div>';
      flow.appendChild(card);
      scrollBottom();
    }

    function setupStream() {
      if (!(window.runtime && window.runtime.EventsOn)) {
        // No browser fallback exists by design: the desktop runtime is
        // the only transport. The final brief still renders without it.
        console.warn("wails runtime unavailable; token streaming disabled");
        return;
      }
      window.runtime.EventsOn("chat:stream:chunk", data => appendChunk(data.chunk));
    }

    function appendChunk(chunk) {
      if (!activeStream) {
        const flow = document.getElementById("cardsFlow");
        activeStream = document.createElement("div");
        activeStream.className = "gen-card";
        activeStream.innerHTML = '<div class="gen-card-header"><span class="card-tag">' + esc(t().reasoning) +
          '</span></div><div class="card-body" id="liveText"></div>';
        flow.appendChild(activeStream);
      }
      const el = document.getElementById("liveText");
      if (el) el.textContent += chunk;
      scrollBottom();
    }

    function clearStream() {
      if (activeStream) { activeStream.remove(); activeStream = null; }
    }

    async function runPlan() {
      const input = document.getElementById("promptInput");
      const val = input.value.trim();
      if (!val) return;
      if (!currentSessionId) await startNewSession();
      lastPrompt = val;
      input.value = "";
      pushUserBubble(val);
      clearStream();
      try {
        const brief = await invoke("AlignIntentStream", currentSessionId, val);
        clearStream();
        renderPlanCard(brief, false);
        await refreshSessions();
      } catch (e) {
        clearStream();
        pushError(e.message);
      }
    }

    function renderPlanCard(brief, replay) {
      const flow = document.getElementById("cardsFlow");
      if (!replay) flow.innerHTML = "";
      const slug = (brief.proposed_slugs && brief.proposed_slugs[0]) || "feature";
      const card = document.createElement("div");
      card.className = "gen-card";
      const risks = brief.identified_risks || [];
      const bounds = brief.boundaries || [];
      const items = risks.concat(bounds);
      card.innerHTML =
        '<div class="gen-card-header"><span class="card-tag">' + esc(t().planTag) + '</span>' +
        '<span class="meta-line">' + esc(slug) + '</span></div>' +
        '<div class="card-title">' + esc(slug.replace(/-/g, " ")) + '</div>' +
        '<div class="card-body">' + esc(brief.restated_intent || "") + '</div>' +
        (items.length ? '<div class="invariants-box"><strong>' +
          (currentLang === "zh" ? "模型指出的风险与边界" : "Risks and boundaries the model stated") +
          '</strong><ul>' + items.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>' : '') +
        (brief.degraded ? '<div class="meta-line">' + esc(t().degraded) + '</div>' : '') +
        '<div class="row-actions"><button class="btn-primary" id="btnExecute">' + esc(t().execute) + '</button></div>';
      flow.appendChild(card);
      card.querySelector("#btnExecute").onclick = () => executeGoal(slug);
      scrollBottom();
    }

    async function executeGoal(slug) {
      const btn = document.getElementById("btnExecute");
      if (btn) { btn.disabled = true; btn.textContent = "…"; }
      try {
        const run = await invoke("StartGoal", currentSessionId, slug, lastPrompt);
        currentRunId = run.run_id;
        renderGoalCard({
          run_id: run.run_id,
          slug: run.feature_slug,
          status: run.status,
          loop_stage: run.loop_stage,
          stages: run.stage_plan
        }, false);
        await refreshFeatures();
        selectFeature(slug);
      } catch (e) {
        pushError(e.message);
        if (btn) { btn.disabled = false; btn.textContent = t().execute; }
      }
    }

    function renderGoalCard(payload, replay) {
      const flow = document.getElementById("cardsFlow");
      if (!replay) { /* append below the plan card */ }
      const card = document.createElement("div");
      card.className = "gen-card";
      card.id = "goalCard";
      card.innerHTML =
        '<div class="gen-card-header"><span class="card-tag goal">' + esc(t().goalTag) + '</span>' +
        '<span class="meta-line">' + esc(payload.run_id) + '</span></div>' +
        '<div class="card-title">' + esc(payload.slug) + '</div>' +
        '<div class="meta-line" id="statusLine">status: ' + esc(payload.status || "") + ' · loop: ' + esc(payload.loop_stage || "") + '</div>' +
        '<div id="stageList"></div>' +
        '<div class="row-actions">' +
        '<select id="executorSelect" title="' + esc(t().selectExecutor) + '" style="font-size:0.75rem;border:1px solid var(--border);border-radius:7px;padding:4px 7px;background:#fff;color:var(--text);max-width:150px;"></select>' +
        '<button class="btn-outline" id="btnAdvance">' + esc(t().advance) + '</button>' +
        '<button class="btn-outline" id="btnRefresh">' + (currentLang === "zh" ? "刷新状态" : "Refresh") + '</button>' +
        '<button class="btn-primary" id="btnRelease">' + esc(t().approve) + '</button></div>' +
        '<div id="parkSlot"></div>' +
        '<div id="verdictSlot"></div>';
      flow.appendChild(card);
      const list = card.querySelector("#stageList");
      (payload.stages || []).forEach(s => {
        const row = document.createElement("div");
        row.className = "stage-row";
        row.innerHTML = '<span class="stage-name">' + esc(s.stage) + '</span>' +
          '<span class="state ' + esc(s.status) + '">' + esc(s.status) + '</span>';
        list.appendChild(row);
      });
      card.querySelector("#btnRefresh").onclick = () => refreshRun(card);
      card.querySelector("#btnRelease").onclick = () => releaseRun(card);
      card.querySelector("#btnAdvance").onclick = () => advanceRun(card);
      fillExecutorOptions(card);
      scrollBottom();
    }

    async function refreshRun(card) {
      if (!currentRunId) return;
      try {
        const run = await invoke("GetGoalStatus", currentRunId);
        const list = card.querySelector("#stageList");
        list.innerHTML = "";
        (run.stage_plan || []).forEach(s => {
          const row = document.createElement("div");
          row.className = "stage-row";
          row.innerHTML = '<span class="stage-name">' + esc(s.stage) + '</span>' +
            '<span class="state ' + esc(s.status) + '">' + esc(s.status) + '</span>';
          list.appendChild(row);
        });
        card.querySelector(".meta-line").textContent = run.run_id;
      } catch (e) {
        pushError(e.message);
      }
    }

    async function releaseRun(card) {
      if (!currentRunId) return;
      try {
        const res = await invoke("ReleaseGoal", currentSessionId, currentRunId);
        renderVerdict(res);
      } catch (e) {
        pushError(e.message);
      }
    }

    // Offer only the agent backends this machine can actually start; one
    // whose command is missing is shown as unavailable and disabled
    // rather than offered and then failing at run time.
    function fillExecutorOptions(card) {
      const sel = card ? card.querySelector("#executorSelect") : null;
      if (!sel) return;
      invoke("Executors").then(function (opts) {
        sel.innerHTML = "";
        (opts || []).forEach(function (o) {
          const op = document.createElement("option");
          op.value = o.name;
          op.textContent = o.name + (o.available ? "" : " " + t().unavailable);
          op.disabled = !o.available;
          sel.appendChild(op);
        });
      }).catch(function () { /* bridge absent: leave the select empty */ });
    }

    // One advance: bind the chosen backend (if any), then push the run a
    // single step. Whatever comes back is rendered, park included — a
    // blocked run shows its reason code and never a completion.
    async function advanceRun(card) {
      if (!currentRunId) return;
      const sel = card ? card.querySelector("#executorSelect") : null;
      const btn = card ? card.querySelector("#btnAdvance") : null;
      const profile = sel ? sel.value : "";
      if (btn) { btn.disabled = true; btn.textContent = "…"; }
      try {
        if (profile) await invoke("UseExecutor", profile, []);
        const run = await invoke("AdvanceRun", currentSessionId, currentRunId);
        renderRunState(card, run);
      } catch (e) {
        pushError(e.message);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = t().advance; }
      }
    }

    function renderRunState(card, run) {
      if (!card || !run) return;
      let txt = "status: " + (run.status || "") + " · loop: " + (run.loop_stage || "");
      if (run.blocked) txt += " · blocked";
      const line = card.querySelector("#statusLine");
      if (line) line.textContent = txt;
      const list = card.querySelector("#stageList");
      if (list) {
        list.innerHTML = "";
        (run.stage_plan || []).forEach(function (s) {
          const row = document.createElement("div");
          row.className = "stage-row";
          row.innerHTML = '<span class="stage-name">' + esc(s.stage) + '</span>' +
            '<span class="state ' + esc(s.status) + '">' + esc(s.status) + '</span>';
          list.appendChild(row);
        });
      }
      // A park is stated plainly with its reason code; nothing here
      // renders a park as a pass.
      const park = card.querySelector("#parkSlot");
      if (park) {
        park.innerHTML = run.reason_code
          ? '<div class="meta-line" style="color:#b45309;">parked: ' + esc(run.reason_code) + '</div>'
          : "";
      }
    }

    function renderVerdict(res) {
      const slot = document.getElementById("verdictSlot") || document.getElementById("cardsFlow");
      const pass = res.verdict === "pass" && res.completed;
      const box = document.createElement("div");
      box.className = "verdict " + (pass ? "pass" : "block");
      const reasons = (res.reason_codes || []);
      let head;
      if (res.completed) {
        head = currentLang === "zh" ? "发布门禁通过，运行已由人工确认完成。" : "Release gate passed; the run is completed with human confirmation.";
      } else if (res.verdict === "pass") {
        head = currentLang === "zh" ? "门禁通过，但运行还无法完成：" : "Gate passed, but the run cannot complete yet:";
      } else {
        head = currentLang === "zh" ? "发布门禁未通过，运行保持阻塞：" : "Release gate did not pass; the run stays blocked:";
      }
      box.innerHTML = "<div>" + esc(head) + "</div>" +
        (reasons.length ? "<ul>" + reasons.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>" : "") +
        (res.detail ? '<div class="meta-line">' + esc(res.detail) + "</div>" : "");
      slot.innerHTML = "";
      slot.appendChild(box);
      scrollBottom();
    }

    async function refreshFeatures() {
      let list = [];
      try { list = await invoke("GetFeatures"); } catch (e) { console.warn(e); }
      list = list || [];
      const el = document.getElementById("featureList");
      document.getElementById("featureCount").textContent = String(list.length);
      el.innerHTML = "";
      if (list.length === 0) {
        el.innerHTML = '<div class="empty-hint">' + esc(t().noFeatures) + '</div>';
        return;
      }
      list.forEach(f => {
        const item = document.createElement("div");
        item.className = "feature-item" + (f.slug === currentSlug ? " active" : "");
        item.innerHTML = '<span>' + esc(f.slug) + '</span><span class="feature-state">' +
          esc(f.frozen ? "frozen" : f.status) + '</span>';
        item.onclick = () => selectFeature(f.slug);
        el.appendChild(item);
      });
    }

    async function selectFeature(slug) {
      currentSlug = slug;
      document.getElementById("inspectorSlug").textContent = slug;
      document.getElementById("inspectorTabs").style.display = "flex";
      try {
        inspectorCache = await invoke("GetFeatureContent", slug);
        renderTab();
      } catch (e) {
        document.getElementById("inspectorBody").textContent = e.message;
      }
      await refreshFeatures();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll("#inspectorTabs .tab").forEach(el => {
        el.classList.toggle("active", el.dataset.tab === tab);
      });
      renderTab();
    }

    function renderTab() {
      const body = document.getElementById("inspectorBody");
      if (!inspectorCache) return;
      if (activeTab === "truth") body.textContent = inspectorCache.truth_md || "(empty)";
      else if (activeTab === "tests") body.textContent = inspectorCache.tests_md || "(empty)";
      else {
        const gates = inspectorCache.gates || [];
        body.innerHTML = gates.length
          ? gates.map(g => '<div class="gate-row"><span>' + esc(g.gate_type) + '</span><span class="state ' +
              (g.verdict === "pass" ? "done" : "blocked") + '">' + esc(g.verdict) + '</span></div>').join("")
          : '<div class="empty-hint">' + (currentLang === "zh" ? "还没有门禁结论" : "No gate verdicts yet") + '</div>';
      }
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        runPlan();
      }
    }

    async function openSettings() {
      document.getElementById("settingsModal").style.display = "flex";
      try {
        const cfg = await invoke("GetSettings");
        if (cfg && cfg.providers && cfg.providers.opencodex) {
          document.getElementById("cfgBaseUrl").value = cfg.providers.opencodex.base_url || "";
        }
        if (cfg && cfg.roles) {
          if (cfg.roles.chief_of_staff) document.getElementById("modelChief").value = cfg.roles.chief_of_staff.model || "";
          if (cfg.roles.architect) document.getElementById("modelArchitect").value = cfg.roles.architect.model || "";
          if (cfg.roles.coder) document.getElementById("modelCoder").value = cfg.roles.coder.model || "";
        }
      } catch (e) { console.warn(e); }
    }

    function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }

    async function saveSettings() {
      const payload = {
        version: "v2",
        providers: {
          opencodex: {
            base_url: document.getElementById("cfgBaseUrl").value.trim(),
            api_key: "tuzki-local"
          }
        },
        roles: {
          chief_of_staff: { provider: "opencodex", model: document.getElementById("modelChief").value.trim(), temperature: 0.1, max_tokens: 4096 },
          architect: { provider: "opencodex", model: document.getElementById("modelArchitect").value.trim(), temperature: 0.0, max_tokens: 8192 },
          coder: { provider: "opencodex", model: document.getElementById("modelCoder").value.trim(), temperature: 0.2, max_tokens: 8192 },
          qa: { provider: "opencodex", model: document.getElementById("modelCoder").value.trim(), temperature: 0.0, max_tokens: 4096 }
        }
      };
      try {
        await invoke("SaveSettings", payload);
        closeSettings();
      } catch (e) {
        alert("Save failed: " + e.message);
      }
    }
  </script>
</body>
</html>
