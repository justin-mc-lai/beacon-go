name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/beacon/${RELEASE_TAG}/release/${RELEASE_TAG}.md"
          bash scripts/check_version_consistency.sh --tag "$RELEASE_TAG" --release-notes "$notes"
          mkdir -p release-candidate
          cp "$notes" release-candidate/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate/release-notes.md
          if-no-files-found: error

  cli:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shell interpreter required by shell TC contract
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: go test ./... -count=1
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="beacon-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/beacon
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: beacon-*

  publish:
    needs: [preflight, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/beacon-*
            dist/SHA256SUMS.txt
