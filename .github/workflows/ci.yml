name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: AC-025 file-size guard
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check_file_size.sh
      - name: AC-095 benchmark regression gate (recorded artifacts)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/beacon doctor bench-gate --baseline bench/results-go5-baseline.json --current bench/results-merged-full.json

  windows-advisory:
    # Windows is advisory until the worktree/path suite is verified on a
    # real Windows runner; a red advisory job is signal, not a gate.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./... -count=1
